[project]
name = "vault-memory"
version = "0.1.0"
description = "A memory layer for Claude over an Obsidian vault: encode once, recall one small block"
readme = "README.md"
authors = [
    { name = "Abhay Mettu", email = "113219143+abhaymettu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
]

[project.scripts]
vault-memory = "vault_memory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
